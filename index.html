<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificado Paternal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- TELA INICIAL -->
        <section id="inicio">

            <h1> Certificado Paternal</h1>

            <p>Avaliação Oficial de 2026</p>
            <p> Letra grande porque considerrei o fato do senhor estar velho</p>

            <button id="btn-iniciar">
                INICIAR AVALIAÇÃO
            </button>

        </section>


        <!-- TELA DE PERGUNTAS -->
        <section id="quiz">

            <h2 id="numero-pergunta">
                Questão 1
            </h2>

            <p id="pergunta">
                Pergunta aqui
            </p>

            <div id="alternativas">
                <!-- JS vai colocar os botões aqui -->
            </div>

        </section>


        <!-- TELA DE RESULTADO -->
        <section id="resultado">

            <h1>Resultado</h1>

            <p id="pontuacao">
                Pontuação: 0
            </p>

            <button id="btn-certificado">
                Emitir certificado
            </button>

        </section>


        <!-- CERTIFICADO -->
        <section id="certificado">

            <h1>CERTIFICADO OFICIAL</h1>

            <p>Certificamos que</p>

            <h2 id="nome">
                PAI
            </h2>

            <p>
                concluiu a avaliação paternal de 2026.
            </p>

            <h2>Prêmio:</h2>

            <h1> MINHA PRESENÇA </h1>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
